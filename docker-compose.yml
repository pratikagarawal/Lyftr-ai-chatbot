
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: lyftr-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      LLM_API_KEYS: ${LLM_API_KEYS}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-false}
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
    volumes:
      - lyftr_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: lyftr-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lyftr_data:
